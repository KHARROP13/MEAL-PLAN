<div class="hdr"><div class="in">
<h1>🍂 K &amp; P — Autumn 6 Week Plan</h1>

</div>

  </div>

  <div class="stamp">Autumn plan v2 · every link goes to a specific free recipe · edit this file and push to GitHub</div>
</div>
<script>
const PLAN_VERSION="2026-09-19-autumn-v2";

/* ══════════════════════════════════════════════════════════════════
   TARGETS
   K: protein protected at 140g. Calories sit around 1,550 because the
   two cannot both hold — see the "Why 1,550" panel in the How To tab.
   P: unchanged. No red meat anywhere in this plan.
   ══════════════════════════════════════════════════════════════════ */
const TARGETS={k:{cal:1600,pro:140,calT:1800,proT:160},p:{cal:1900,pro:170,calT:2200,proT:190}};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

 "Greek & Aegean",
 "Turkish & Levantine",
 "Italian & Eastern Mediterranean",
 "Moroccan & North African",
 "Greek & Aegean — second pass",
 "Levantine & North African — second pass"];

const SKEY="kp_mealplan_autumn_v2";
let S={start:null,ticks:{},training:{},view:"plan",week:0,day:0};
function load(){try{const r=localStorage.getItem(SKEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}

/* ══════════════════════════════════════════════════════════════════
   PROTEIN SWAPS — standard food-composition values for the portion
   named. These come from ordinary nutrition tables, NOT from the
   recipe pages. They are added on top of the recipe's own figures.
   ══════════════════════════════════════════════════════════════════ */
const SW={

};

   or is explicitly marked as having no link. No site-search URLs.

   pub:false = the page doesn't publish nutrition, so the figure is my

   ══════════════════════════════════════════════════════════════════ */

const RC={
 // ── Soups, one per week ──

  serves:6,c:265,pr:9,pub:false,mins:30,
  d:"Cannellini beans, celery, onion, garlic, oregano, lemon and a generous pour of olive oil"}),
 turkish:R({n:"Turkish Red Lentil Soup (Mercimek Çorbası)",src:"The Mediterranean Dish",
  url:"https://www.themediterraneandish.com/turkish-lentil-soup/",

 menemen:R({n:"Menemen (Turkish Eggs)",src:"The Mediterranean Dish",
  url:"https://www.themediterraneandish.com/menemen-recipe/",
  serves:4,c:165,pr:7,pub:true,mins:25,eggs:true,
  d:"Eggs folded through soft spiced tomatoes and green peppers — one pan"}),

 chermoula:R({n:"Chermoula Roasted Cauliflower",src:"Your Quick Roasting Tin book",
  url:null,noLinkWhy:"Your own book — no link. Look for the cauliflower traybake.",
  serves:4,c:180,pr:6,pub:false,mins:35,
  d:"Moroccan herb, lemon and cumin sauce over roasted cauliflower, rocket alongside"}),
 puysquash:R({n:"Warm Puy Lentil & Roasted Squash Bowl",src:"Your own recipe",
  url:null,noLinkWhy:"Your own assembly — no recipe needed.",
  serves:4,c:320,pr:13,pub:false,mins:40,
  d:"Roasted butternut squash, puy lentils, kale and a tahini-lemon dressing"}),
};

/* Build a plate: (servings of the recipe) + named protein swaps.
   This is the whole arithmetic — nothing else is added anywhere. */
function plate(rc,servings,swapKeys){
 const c=rc.c*servings+swapKeys.reduce((a,k)=>a+SW[k].c,0);
 const pr=rc.pr*servings+swapKeys.reduce((a,k)=>a+SW[k].pr,0);
 return {c:Math.round(c),pr:Math.round(pr),
  sw:swapKeys.map(k=>SW[k].d).join(" + "),
  portion:servings===1?"1 serving":servings+" servings"};
}
function dinner(rc,kServ,kSw,pServ,pSw){
 return {rc,n:rc.n,d:rc.d,eggs:rc.eggs,k:plate(rc,kServ,kSw),p:plate(rc,pServ,pSw)};
}
function soupDinner(rc){
 return {rc,n:"🍲 "+rc.n,d:rc.d,soup:true,
  k:plate(rc,1,["tofu150","feta40"]),p:plate(rc,1.5,["chicken150"])};
}
function soupLunch(rc){
 const p=plate(rc,1,["edamame100","feta40"]);
 return {rc,n:"🍲 "+rc.n+" (from Thursday's batch)",
  d:rc.d+" — reheated, with edamame and feta stirred in",
  soupLeftover:true,c:p.c,pr:p.pr};
}

   ══════════════════════════════════════════════════════════════════ */
const BF=[
{n:"Overnight Oats with Berries",d:"Oats, chia, protein powder, Greek yoghurt, mixed berries — made the night before",kc:340,kp:34,pc:475,pp:42},
{n:"Apple Cinnamon Protein Porridge",d:"Porridge oats, grated apple, cinnamon, protein powder stirred in at the end, walnuts",kc:335,kp:32,pc:470,pp:40},

{n:"Houmous & Halloumi Plate",d:"80g grilled halloumi, houmous, cucumber, cherry tomatoes, olives, rocket, seeds",c:410,pr:25},

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getStart(){if(!S.start){S.start="2026-09-21";save();}return S.start;}
function dayIndexFromStart(){const s=new Date(getStart()+"T00:00:00"),t=new Date(todayISO()+"T00:00:00");return Math.floor((t-s)/86400000);}
function currentSlot(){const n=dayIndexFromStart();if(n<0)return{w:0,d:0,pre:true,n};if(n>41)return{w:5,d:6,post:true,n};return{w:Math.floor(n/7),d:n%7,n};}
function setStart(){S.start=document.getElementById("startDate").value;save();jumpToday();}
function jumpToday(){const c=currentSlot();S.week=c.w;S.day=c.d;S.view="plan";save();renderAll();}

 +'<div class="tip"><div class="ti">1️⃣</div><div><div class="tt">Bake a tray of tofu and a tray of tempeh</div><div class="tbd">Extra-firm tofu, pressed 15 minutes, crumbled or cubed, 25–30 min at 220°C. Tempeh sliced, marinated in soy, garlic and ginger, 25 min at 200°C. Covers most of K’s dinners.</div></div></div>'
 +'<div class="tip"><div class="ti">2️⃣</div><div><div class="tt">Make the kale salad</div><div class="tbd">One batch is Tuesday and Thursday lunch — two days apart, so it is still good when you get to it.</div></div></div>'
 +'<div class="tip"><div class="ti">3️⃣</div><div><div class="tt">Jar of tahini-lemon dressing</div><div class="tbd">Tahini, lemon, garlic, water. Goes on most of the lunches here.</div></div></div>'
 +'<div class="tip"><div class="ti">4️⃣</div><div><div class="tt">Thursday: make the whole pot of soup</div><div class="tbd">It is dinner for both of you that night, then K’s lunch on Friday and Sunday. Do not halve it.</div></div></div>'
 +'</div>'
 +'<div class="box"><h3>🍖 P at Tossed</h3>'
 +'<div class="tip"><div class="ti">✅</div><div><div class="tt">Order this</div><div class="tbd">Double grilled chicken on a leaf base, as many veg toppings as they will give you, no dressing — lemon wedges instead.</div></div></div>'
 +'<div class="tip"><div class="ti">⚠️</div><div><div class="tt">Skip this</div><div class="tbd">Dressings, croutons, anything crispy, grain bases.</div></div></div>'
 +'</div>';
}

const TABS=[["plan","Daily Plan"],["overview","Week"],["tips","How To"],["sources","📖 Sources"],["pantry","🫙 Pantry"],["shop","🛒 Fresh Shop"]];
function renderNav(){document.getElementById("navBar").innerHTML=TABS.map(function(t){return '<button class="'+(S.view===t[0]?"on":"")+'" onclick="setView(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");}
function setView(v){S.view=v;save();renderAll();}
function setWeek(i){S.week=i;S.day=0;save();renderAll();}
function setDay(i){S.day=i;save();renderAll();}
function goDay(i){S.day=i;S.view="plan";save();renderAll();}
function renderSelectors(){
 const showW=["plan","overview"].indexOf(S.view)>-1,showD=S.view==="plan";
 document.getElementById("selectors").style.display=showW?"block":"none";
 const lbls=document.querySelectorAll("#selectors .lbl");
 if(lbls[1])lbls[1].style.display=showD?"block":"none";
 document.getElementById("dbtns").style.display=showD?"flex":"none";
 document.getElementById("wbtns").innerHTML=THEMES.map(function(t,i){return '<button class="wb '+(i===S.week?"on":"")+'" onclick="setWeek('+i+')">W'+(i+1)+'</button>';}).join("");
 document.getElementById("wtheme").textContent=THEMES[S.week]+" · soup night: "+WEEK_SOUP[S.week].n;
 const cur=currentSlot();
 document.getElementById("dbtns").innerHTML=DAYS.map(function(d,i){
  const isToday=!cur.pre&&!cur.post&&cur.w===S.week&&cur.d===i;
  return '<button class="db '+(i===S.day?"on":"")+'" onclick="setDay('+i+')">'+d+(isToday?'<span class="dot">🟢</span>':"")+'</button>';}).join("");
}
function renderMain(){
 const el=document.getElementById("content");
 if(S.view==="plan")el.innerHTML=viewPlan();
 else if(S.view==="overview")el.innerHTML=viewOverview();
 else if(S.view==="tips")el.innerHTML=viewTips();
 else if(S.view==="sources")el.innerHTML=viewSources();
 else if(S.view==="pantry")el.innerHTML=viewPantry();
 else if(S.view==="shop")el.innerHTML=viewShop();
}
function renderToday(){
 document.getElementById("startDate").value=getStart();
 const c=currentSlot(),el=document.getElementById("todayLbl");
 if(c.pre)el.textContent="Starts in "+(-c.n)+" days";
 else if(c.post)el.textContent="Plan complete 🎉";
 else el.textContent="Week "+(c.w+1)+" · "+DAYS[c.d];
}
function renderAll(){renderNav();renderToday();renderSelectors();renderMain();}
load();getStart();
(function(){const c=currentSlot();if(!c.pre&&!c.post&&S.week===0&&S.day===0){S.week=c.w;S.day=c.d;}})();
renderAll();
</script>
</body>
</html>
